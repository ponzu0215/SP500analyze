<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イラストプレビュー — 2026-03-23</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 20px;
      font-family: 'Noto Sans JP', sans-serif;
      color: #1a1a2e;
    }

    h1 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: #7a8090;
      font-family: 'DM Mono', monospace;
    }

    /* ── モックアップ：実際のレポート上の配置イメージ ── */
    .mock-card {
      background: white;
      border: 1px solid #dde2ea;
      border-radius: 4px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 540px;
    }

    .mock-info { flex: 1; }

    .mock-date {
      font-size: 11px;
      color: #8a90a0;
      font-family: 'DM Mono', monospace;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
    }

    .mock-nav {
      font-size: 38px;
      font-weight: 500;
      color: #0d1f52;
      font-family: 'DM Mono', monospace;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 8px;
    }

    .mock-diff {
      font-size: 14px;
      color: #e74c3c;
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mock-diff::before {
      content: '前日対比：';
      font-size: 11px;
      color: #8a90a0;
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* ── SVGイラスト本体 ── */
    .illustration-wrap {
      flex-shrink: 0;
    }

    .illustration-wrap svg {
      display: block;
      border-radius: 6px;
      overflow: visible;
    }

    /* ── 炎アニメーション ── */
    @keyframes flicker {
      0%, 100% { transform: translate(138px, 108px) scaleX(1) scaleY(1); }
      25%       { transform: translate(138px, 108px) scaleX(0.92) scaleY(1.06); }
      50%       { transform: translate(138px, 108px) scaleX(1.05) scaleY(0.96); }
      75%       { transform: translate(138px, 108px) scaleX(0.95) scaleY(1.04); }
    }

    /* ── 矢印パルス ── */
    @keyframes arrowPulse {
      0%, 100% { opacity: 1; transform: translate(42px, 98px) translateY(0); }
      50%       { opacity: 0.75; transform: translate(42px, 98px) translateY(4px); }
    }

    /* ── 雨アニメーション ── */
    @keyframes rain {
      0%   { transform: translateY(0); opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.55; }
      100% { transform: translateY(20px); opacity: 0; }
    }

    .rain-group {
      animation: rain 1.4s linear infinite;
    }
    .rain-group-2 {
      animation: rain 1.4s linear infinite 0.7s;
    }

    /* ── 雷フラッシュ ── */
    @keyframes lightningFlash {
      0%, 88%, 100% { opacity: 0.95; }
      90%            { opacity: 0.3; }
      93%            { opacity: 1; }
      96%            { opacity: 0.5; }
    }

    .lightning { animation: lightningFlash 4s ease-in-out infinite 1s; }

    /* ── キャプション ── */
    .caption {
      text-align: center;
    }
    .caption-main {
      font-size: 13px;
      font-weight: 500;
      color: #2a3050;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }
    .caption-sub {
      font-size: 11px;
      color: #8a90a0;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.06em;
    }

    /* ── スタンドアロンSVG（大）── */
    .standalone {
      background: white;
      border: 1px solid #dde2ea;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .standalone svg {
      border-radius: 8px;
    }

    .divider {
      width: 100%;
      max-width: 540px;
      border: none;
      border-top: 1px solid #dde2ea;
    }

    .label {
      font-size: 10px;
      color: #aab0c0;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      align-self: flex-start;
      max-width: 540px;
      width: 100%;
    }
  </style>
</head>
